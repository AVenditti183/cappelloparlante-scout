<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Cappello Parlante</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>🎙️ Cappello Parlante</h1>
        <p class="subtitle">Testo in italiano, voce a tua scelta</p>
      </header>

      <main class="content">
        <textarea
          id="text-input"
          class="text-input"
          placeholder="Scrivi o incolla qui il testo in italiano..."
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
        ></textarea>

        <div class="accent-toggle" role="group" aria-label="Tipo di accento">
          <button type="button" id="accent-it" class="accent-btn" data-lang="it" aria-pressed="false">
            🇮🇹 Voce italiana
          </button>
          <button type="button" id="accent-en" class="accent-btn is-active" data-lang="en" aria-pressed="true">
            🇬🇧 Accento inglese
          </button>
        </div>

        <div class="field">
          <label for="voice-select">Voce</label>
          <select id="voice-select"></select>
        </div>

        <div class="sliders">
          <div class="field">
            <label for="rate-input">Velocità <span id="rate-value" class="value-pill">0.95×</span></label>
            <input type="range" id="rate-input" min="0.5" max="1.6" step="0.05" value="0.95" />
          </div>
          <div class="field">
            <label for="pitch-input">Tono <span id="pitch-value" class="value-pill">1.0</span></label>
            <input type="range" id="pitch-input" min="0" max="2" step="0.1" value="1" />
          </div>
        </div>

        <p id="status" class="status" aria-live="polite">Pronto.</p>
      </main>

      <footer class="control-bar">
        <button id="btn-play" class="btn btn-primary" type="button">▶ Ascolta</button>
        <button id="btn-pause" class="btn" type="button" disabled>⏸ Pausa</button>
        <button id="btn-stop" class="btn" type="button" disabled>⏹ Stop</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
